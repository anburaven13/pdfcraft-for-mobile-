[package]
name = "pdfcraft-android"
description = "Android JNI bindings for PdfCraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-organize = { workspace = true }
pdfcraft-render = { workspace = true }
pdfcraft-crypt = { workspace = true }
pdfcraft-forms = { workspace = true }
pdfcraft-engine = { workspace = true }
pdfcraft-model = { workspace = true }
jni = "0.22"
bytemuck = "1"
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
